[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
libs = ["contracts/lib"]
remappings = ["forge-std/=contracts/lib/forge-std/src/"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"
